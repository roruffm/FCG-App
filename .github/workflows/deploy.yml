name: Webseite veröffentlichen

# Baut die App bei jedem Push auf den Standard-Branch und stellt sie über
# GitHub Pages bereit: https://roruffm.github.io/FCG-App/
#
# Einmalig von Hand nötig: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Das Token eines Workflows darf eine Pages-Seite
# nicht selbst anlegen und scheitert sonst mit
# "Resource not accessible by integration".
#
# Ein Basispfad muss nicht gesetzt werden: Vite baut mit `base: './'`, alle
# Verweise sind relativ, und der Router arbeitet mit Hash-Routen. Die Seite
# läuft dadurch sowohl unter /FCG-App/ als auch unter einer eigenen Domain.

on:
  push:
    branches:
      - claude/app-creation-ps9u52
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veröffentlichungen nicht abbrechen, aber auch nicht überholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typen prüfen und bauen
        run: npm run build

      # GitHub Pages liefert unbekannte Pfade nicht an die App aus. Die App
      # nutzt Hash-Routen, ein direkt aufgerufener Pfad ohne Raute landet
      # trotzdem hier - und von dort in der App.
      - name: Fallback-Seite ablegen
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

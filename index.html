<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#006269" />
    <meta name="description" content="FCG Frankfurt App (Prototyp) - Gemeinde verbinden. Glauben vertiefen. Alltag erreichen." />
    <!--
      Solange dies ein Prototyp mit Beispielinhalten ist, gehoert er nicht in
      Suchmaschinen - erfundene Namen unter dem Namen einer echten Gemeinde
      waeren dort besonders schaedlich.

      VOR DER OFFIZIELLEN VEROEFFENTLICHUNG ENTFERNEN, sonst bleibt die fertige
      App unsichtbar. Ebenso public/robots.txt.

      Kein Zugangsschutz: Wer die Adresse kennt, kommt weiterhin hinein.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./fcg-logo.png" />
    <link rel="apple-touch-icon" href="./fcg-logo.png" />
    <title>FCG Frankfurt App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Notstart.

      Bleibt die Seite leer, hilft heute nur Aktualisieren von Hand. Genau das
      macht dieser Wachhund von selbst: Hat React nach ein paar Sekunden nichts
      gerendert - oder scheitert schon das Laden des Skripts -, raeumt er
      Service Worker und Caches ab und laedt einmal neu.

      Warum so grob: Die Ursache einer weissen Seite ist von aussen nicht zu
      unterscheiden (veraltetes HTML, fehlende Datei, abgebrochener Download,
      Absturz beim Rendern). Abraeumen und einmal frisch laden hilft bei allen,
      und ein einzelner Neustart kostet weniger als eine Seite, die nie kommt.

      Gegen Endlosschleifen: Der Versuch wird in sessionStorage vermerkt und
      genau einmal pro Sitzung unternommen. Danach erscheint eine sichtbare
      Meldung statt Weiss - und ein Knopf, der den Grund nennt. Eine leere
      Seite ohne Hinweis ist das Schlimmste von allem.
    -->
    <script>
      (function () {
        var MARKE = 'fcg-app:notstart'
        var PROTOKOLL = 'fcg-app:protokoll'
        var WARTEN = 5000
        var erledigt = false

        /*
          Kleines Protokoll, das ein Aktualisieren ueberlebt (sessionStorage
          bleibt im selben Tab bestehen). Es haelt fest, was bei jedem
          Seitenwechsel passiert ist und welche Fehler auftraten - denn eine
          leere Seite sagt von sich aus nichts. Auf #/diagnose steht es dann
          lesbar; ein Bildschirmfoto genuegt zur Fehlersuche.
        */
        var start = Date.now()
        function notiere(art, text) {
          try {
            var liste = JSON.parse(sessionStorage.getItem(PROTOKOLL) || '[]')
            liste.push({ t: Date.now() - start, art: art, text: String(text).slice(0, 300) })
            // Nur die letzten Eintraege behalten - das Protokoll soll klein bleiben.
            sessionStorage.setItem(PROTOKOLL, JSON.stringify(liste.slice(-40)))
          } catch (e) {}
        }
        window.__fcgNotiere = notiere

        function wurzelKinder() {
          var w = document.getElementById('root')
          return w ? w.children.length : -1
        }

        notiere('start', location.hash || '#/')

        window.addEventListener('hashchange', function () {
          notiere('wechsel', location.hash)
          // Kurz danach nachsehen, ob etwas dasteht.
          window.setTimeout(function () {
            /*
              Die vier Zahlen entscheiden die Frage, die von aussen nicht zu
              beantworten ist: Ist nichts gerendert (root=0), oder ist gerendert
              und man sieht es nur nicht, weil die Seite unter dem Bildausschnitt
              steht (scrollY gross, hoehe klein)?
            */
            var w = document.getElementById('root') || {}
            notiere(
              'nachher',
              location.hash +
                ' -> root=' + wurzelKinder() +
                ', hoehe=' + w.offsetHeight +
                ', scrollY=' + Math.round(window.scrollY) +
                ', fenster=' + window.innerHeight
            )
          }, 600)
        })

        window.addEventListener('error', function (e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) return
          notiere('fehler', (e && e.message) || 'unbekannt')
        })
        window.addEventListener('unhandledrejection', function (e) {
          notiere('abgelehnt', (e && e.reason && (e.reason.message || e.reason)) || 'unbekannt')
        })

        function gestartet() {
          var wurzel = document.getElementById('root')
          return wurzel && wurzel.children.length > 0
        }

        function meldung(grund) {
          var wurzel = document.getElementById('root')
          if (!wurzel) return
          wurzel.innerHTML =
            '<div style="max-width:33rem;margin:0 auto;padding:40px 20px;font:400 15px/1.6 system-ui,sans-serif;color:#000">' +
            '<h1 style="font-size:1.3rem;margin:0 0 10px">Die App konnte nicht starten</h1>' +
            '<p style="margin:0 0 16px;color:#55686a">Ein Neustart hat schon nicht geholfen. Meist liegt es an einer ' +
            'unterbrochenen Verbindung - manchmal an einem Fehler in der App.</p>' +
            '<button id="fcg-neu" style="appearance:none;border:0;border-radius:999px;background:#006269;color:#fff;' +
            'font:700 15px system-ui,sans-serif;padding:12px 20px;cursor:pointer">Nochmal versuchen</button>' +
            '<p style="margin:18px 0 0;font-size:12px;color:#55686a">Grund: ' + grund + '</p>' +
            '<p style="margin:6px 0 0;font-size:12px;color:#55686a">Adresse: ' + location.href + '</p>' +
            '</div>'
          var knopf = document.getElementById('fcg-neu')
          if (knopf) knopf.onclick = function () {
            try { sessionStorage.removeItem(MARKE) } catch (e) {}
            location.reload()
          }
        }

        function notstart(grund) {
          if (erledigt || gestartet()) return
          erledigt = true
          notiere('notstart', grund)

          var schonversucht
          try { schonversucht = sessionStorage.getItem(MARKE) } catch (e) { schonversucht = null }
          if (schonversucht) return meldung(grund)

          try { sessionStorage.setItem(MARKE, grund) } catch (e) { return meldung(grund) }

          var neuladen = function () { location.reload() }
          var aufgaben = []
          if (navigator.serviceWorker) {
            aufgaben.push(
              navigator.serviceWorker.getRegistrations()
                .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) })
                .catch(function () {})
            )
          }
          if (window.caches) {
            aufgaben.push(
              caches.keys()
                .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) })
                .catch(function () {})
            )
          }
          Promise.all(aufgaben).then(neuladen, neuladen)
          // Falls Abraeumen haengt, trotzdem neu laden.
          setTimeout(neuladen, 2500)
        }

        // Eine Datei, die nicht laedt, muss nicht abgewartet werden.
        window.addEventListener(
          'error',
          function (e) {
            var ziel = e.target
            if (!ziel || (ziel.tagName !== 'SCRIPT' && ziel.tagName !== 'LINK')) return

            var adresse = ziel.src || ziel.href || '?'
            notiere('datei', adresse)

            /*
              Nur die eigene Programmdatei ist ein Notfall.

              Die Schriften von Google sind absichtlich unkritisch eingebunden -
              scheitern sie, greift der Ersatz-Stack und die App laeuft normal
              weiter. Frueher loeste auch das den Notstart aus: In einem
              langsamen Mobilnetz haette die App sich grundlos selbst neu
              geladen, was den Fehler ausgeloest haette, den sie beheben soll.
            */
            var eigen = adresse.indexOf(location.origin) === 0
            if (eigen && /\/assets\/.*\.js/.test(adresse)) {
              notstart('Programmdatei nicht geladen: ' + adresse)
            }
          },
          true
        )

        window.setTimeout(function () { notstart('Nach ' + WARTEN / 1000 + ' Sekunden nichts gerendert') }, WARTEN)

        // Laeuft die App, ist der Vermerk hinfaellig - sonst waere der naechste
        // echte Fehlstart in dieser Sitzung sofort die Meldung statt ein Versuch.
        window.addEventListener('load', function () {
          window.setTimeout(function () {
            if (gestartet()) { try { sessionStorage.removeItem(MARKE) } catch (e) {} }
          }, 1200)
        })
      })()
    </script>
  </body>
</html>
